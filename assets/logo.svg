<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Cyber Neon Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7209b7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dark Shield Base Container -->
  <polygon points="100,15 175,50 175,130 100,185 25,130 25,50" fill="#0b132b" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#neonGlow)" />
  <polygon points="100,25 165,56 165,124 100,172 35,124 35,56" fill="#1c2541" opacity="0.6" />

  <!-- Diagonal Dividing Circuit Line -->
  <line x1="50" y1="150" x2="150" y2="50" stroke="#00f2fe" stroke-width="3" stroke-dasharray="6,4" opacity="0.8"/>

  <!-- Left: Human Silhouette (Neon Cyan) -->
  <g fill="url(#cyanGrad)">
    <circle cx="70" cy="70" r="14" />
    <path d="M 50 115 C 50 90, 90 90, 90 115 Z" />
  </g>

  <!-- Right: AI Robot Head (Neon Purple) -->
  <g fill="url(#purpleGrad)">
    <!-- Robot Skull -->
    <rect x="115" y="60" width="30" height="26" rx="6" />
    <!-- Ears / Antennas -->
    <rect x="110" y="68" width="4" height="10" rx="2" fill="#00f2fe"/>
    <rect x="146" y="68" width="4" height="10" rx="2" fill="#00f2fe"/>
    <!-- Glowing Robot Eyes -->
    <circle cx="123" cy="73" r="3.5" fill="#00f2fe" />
    <circle cx="137" cy="73" r="3.5" fill="#00f2fe" />
    <!-- Robot Neck / Body -->
    <path d="M 120 92 L 140 92 L 146 115 L 114 115 Z" />
  </g>

  <!-- Center VS Emblem in Gold -->
  <circle cx="100" cy="100" r="16" fill="#0b132b" stroke="url(#goldGrad)" stroke-width="3" />
  <text x="100" y="105" font-family="sans-serif" font-weight="900" font-size="13" fill="#ffb703" text-anchor="middle">VS</text>
</svg>

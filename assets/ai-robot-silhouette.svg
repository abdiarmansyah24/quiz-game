<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="robotGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0052a3" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Robot Head Profile Silhouette facing left -->
  <path d="M 340 600 Q 260 460 210 400 C 185 360, 175 320, 185 270 C 195 220, 180 170, 210 130 C 240 90, 300 85, 340 125 C 370 155, 380 215, 360 275 Q 325 390, 340 600 Z" fill="url(#robotGlow)" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.7" />
  
  <!-- Robot Ear Mechanical Core Rings -->
  <circle cx="270" cy="220" r="28" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.9"/>
  <circle cx="270" cy="220" r="18" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="270" cy="220" r="8" fill="#00f2fe" opacity="0.9" />

  <!-- Robot Eye Line Glow -->
  <path d="M 205 195 Q 215 190, 225 195" stroke="#00f2fe" stroke-width="4" stroke-linecap="round"/>

  <!-- Neck Mechanical Lines -->
  <path d="M 235 310 Q 270 330, 310 320" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
  <path d="M 225 350 Q 265 370, 305 360" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
</svg>
